org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler computes plugin source paths relative to the
# project dir. This repo lives on D: while the pub cache is on C:, so relativizing
# a plugin source (e.g. url_launcher_android, image_picker_android) throws
# "this and base files have different roots" and the compile daemon dies.
# Non-incremental Kotlin compilation avoids that path entirely.
kotlin.incremental=false
