version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental_admin
      POSTGRES_PASSWORD: rental_password
      POSTGRES_DB: vehicle_rental
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_admin -d vehicle_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rental_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://rental_admin:rental_password@postgres:5432/vehicle_rental?schema=public
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
